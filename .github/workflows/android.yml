name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0e415-filter]
    paths: ['androidApp/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :androidApp:assembleDebug :androidApp:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: karnama-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
