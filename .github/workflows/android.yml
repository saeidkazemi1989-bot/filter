name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0e415-filter]
    paths: ['androidApp/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint Android
        run: |
          set -o pipefail
          gradle :androidApp:assembleDebug :androidApp:lintDebug --no-daemon --console=plain 2>&1 | tee /tmp/android-build.log
      - name: Report build diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          log = Path('/tmp/android-build.log')
          if log.exists():
              text = log.read_text()[-14000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android build diagnostics::' + text)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: karnama-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Backend tests
        run: python3 -m unittest discover -s freelance/tests -v
      - name: Check public source reachability without login
        run: |
          python3 - <<'PYTHON'
          import sys
          sys.path.insert(0, 'freelance')
          from monitor import public_jobs, MonitorError
          try:
              jobs = public_jobs()
              print(f'::notice title=Public source verification::Live HTML parsed: {len(jobs)} project cards. No login or private API used.')
          except MonitorError as error:
              message = str(error).replace('%', '%25').replace('\n', '%0A')
              print('::warning title=Public source not verified::' + message)
          PYTHON
