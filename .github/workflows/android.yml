name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0e415-filter]
    paths: ['androidApp/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :androidApp:assembleDebug :androidApp:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: karnama-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
